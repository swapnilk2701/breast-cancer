project:
  name: "Breast Cancer Mammography Denoising and Enhancement"
  seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "data/processed/results"

data:
  image_size: [256, 256]
  supported_formats: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp"]

pectoral_removal:
  enabled: true
  roi_fraction_h: 0.5
  roi_fraction_w: 0.5
  fill_value: 0

intensity_normalization:
  enabled: true
  method: "robust_min_max"
  p_low: 1.0
  p_high: 99.0
  target_min: 0.0
  target_max: 255.0

noise:
  gaussian:
    var: 0.01
  sp:
    amount: 0.05
  speckle:
    var: 0.04
  mixed_poisson_gaussian:
    gaussian_var: 0.01

denoising:
  median:
    kernel_size: 5
  gaussian:
    kernel_size: [5, 5]
    sigma: 0
  wiener:
    balance: 0.1
  bilateral:
    d: 9
    sigma_color: 75
    sigma_space: 75
  non_local_means:
    h: 10
    template_window_size: 7
    search_window_size: 21
  adaptive_median:
    s_max: 7

enhancement:
  enabled: true
  method: "clahe_unsharp_mask"  # Options: 'he', 'clahe', 'unsharp_mask', 'clahe_unsharp_mask'
  clahe:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  unsharp_mask:
    kernel_size: [5, 5]
    sigma: 1.0
    amount: 1.2
  metrics:
    window_size: 16

